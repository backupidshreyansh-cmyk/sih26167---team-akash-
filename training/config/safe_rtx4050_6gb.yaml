output_dir: "runs/"
dataset_path: "data/pilot_dataset.jsonl"
model_name_or_path: "Qwen/Qwen3-VL-4B-Instruct"

# Hardware Constraints for 6GB VRAM
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
mixed_precision: "bf16" # Switch to fp16 if AMD/older GPU requires it, but RTX 4050 supports bf16 natively
load_in_4bit: true      # Critical for 6GB VRAM with a 4B model

# LoRA Constraints
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules: ["q_proj", "v_proj"]

# Optimization
learning_rate: 2.0e-5
num_train_epochs: 1
max_steps: 10          # Conservative pilot limit
max_samples: 10        # Conservative dataset slice

# Saving
save_strategy: "steps"
save_steps: 5
