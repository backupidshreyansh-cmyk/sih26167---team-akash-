mode: small-gpu
model_name_or_path: "Qwen/Qwen3-VL-4B-Instruct"
dataset_path: "data/dataset.jsonl"
output_dir: "runs/"
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
learning_rate: 2e-5
